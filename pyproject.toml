[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piply-opdf"
version = "0.1.0"
description = "A production-grade, lightweight, self-learning document understanding, OCR, and PDF rebuilding framework"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Piply Team" }]
keywords = [
    "ocr",
    "pdf",
    "document-understanding",
    "layout-detection",
    "document-rebuilding",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "PyMuPDF>=1.23.0",
    "imagehash>=4.3.1",
    "scikit-learn>=1.4.0",
    "Pillow>=10.2.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "PyYAML>=6.0.1",
    "scipy>=1.13.0",
    "rich>=13.7.0",
    # Primary OCR engine. Swappable via `ocr.engine` in configuration — see
    # piply_opdf/ocr/ — but one engine has to be present for the pipeline to
    # read anything at all.
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
]

[project.optional-dependencies]
# Kept for anyone pinning the OCR stack explicitly. PaddleOCR is the primary
# engine and is a core dependency, so this extra is now a no-op alias.
paddle = ["paddlepaddle>=2.6.0", "paddleocr>=2.7.0"]
tesseract = ["pytesseract>=0.3.10"]
# sqlalchemy belongs here: app/database.py and app/models.py import it, and
# without it `pip install .[api]` produces a web app that cannot start.
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.0",
    "jinja2>=3.1.0",
]
excel = ["openpyxl>=3.1.2"]
all = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",
    "pytesseract>=0.3.10",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.2",
]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
piply-opdf = "piply_opdf.cli:app"

[project.urls]
Homepage = "https://github.com/piply/piply-opdf"
Documentation = "https://piply-opdf.readthedocs.io"
Repository = "https://github.com/piply/piply-opdf"
"Bug Tracker" = "https://github.com/piply/piply-opdf/issues"

[tool.hatch.build.targets.wheel]
packages = ["piply_opdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
