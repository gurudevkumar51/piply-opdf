<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piply OPDF - Reconstruction & Comparison</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include html2pdf to easily convert the right pane to PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .reconstructed-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
            background-color: white;
            font-size: 0.875rem;
        }
        .reconstructed-table th, .reconstructed-table td {
            border: 1px solid #d1d5db;
            padding: 0.5rem;
            text-align: left;
            vertical-align: top;
        }
        .reconstructed-table th {
            background-color: #f3f4f6;
            font-weight: bold;
        }
        .cell-low-conf {
            background-color: #fee2e2;
        }
        .cell-med-conf {
            background-color: #fef3c7;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold text-blue-900 tracking-tight">Layout Reconstruction</h1>
        <div class="flex space-x-3 items-center">
            <a href="/" class="text-sm font-medium text-blue-600 hover:text-blue-800 transition mr-4">Back to Dashboard</a>
            <select id="doc-selector" class="border border-gray-300 rounded px-3 py-1.5 text-sm min-w-[200px] focus:outline-none shadow-sm cursor-pointer hover:bg-gray-50" onchange="window.selectDocument(this.value)">
                <option value="">-- Select Document --</option>
            </select>
            <div class="border-l border-gray-300 pl-4 ml-2 flex space-x-2">
                <button onclick="downloadJSON()" class="bg-blue-100 text-blue-800 px-3 py-1 rounded shadow-sm text-xs font-bold hover:bg-blue-200 transition">Download JSON</button>
                <button onclick="downloadCSV()" class="bg-green-100 text-green-800 px-3 py-1 rounded shadow-sm text-xs font-bold hover:bg-green-200 transition">Download CSV</button>
                <button onclick="downloadPDF()" class="bg-red-100 text-red-800 px-3 py-1 rounded shadow-sm text-xs font-bold hover:bg-red-200 transition">Download PDF</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: Original PDF (50%) -->
        <section class="w-1/2 border-r border-gray-300 flex flex-col bg-gray-200">
            <div class="bg-gray-300 p-2 shadow-inner z-10 flex justify-between items-center">
                <span class="text-sm font-bold text-gray-700">Original Document</span>
                <div class="flex space-x-2 items-center">
                    <button class="bg-white px-2 py-1 rounded text-xs shadow" onclick="prevPage()">Prev</button>
                    <span class="text-xs font-bold">Page <span id="current-page">1</span></span>
                    <button class="bg-white px-2 py-1 rounded text-xs shadow" onclick="nextPage()">Next</button>
                </div>
            </div>
            <div class="flex-1 p-4 overflow-auto flex justify-center bg-gray-400">
                <img id="pdf-image" class="block max-w-full shadow-lg bg-white object-contain" src="" style="display:none;">
                <div id="no-doc-msg" class="text-white mt-20">Select a document to view</div>
            </div>
        </section>

        <!-- Right Panel: Reconstructed Layout (50%) -->
        <section class="w-1/2 flex flex-col bg-white overflow-hidden">
            <div class="bg-gray-50 p-2 shadow-inner z-10 border-b border-gray-200 flex justify-between items-center">
                <span class="text-sm font-bold text-gray-700">Reconstructed Data</span>
                <div class="flex items-center space-x-2 text-xs">
                    <span class="flex items-center"><span class="w-3 h-3 inline-block bg-red-100 border border-red-300 mr-1"></span> < 80%</span>
                    <span class="flex items-center"><span class="w-3 h-3 inline-block bg-yellow-100 border border-yellow-300 mr-1"></span> 80-95%</span>
                    <span class="flex items-center"><span class="w-3 h-3 inline-block bg-white border border-gray-300 mr-1"></span> > 95%</span>
                </div>
            </div>
            <div id="reconstructed-content" class="flex-1 p-6 overflow-auto bg-gray-50">
                <div class="text-gray-500 text-center mt-20">Reconstructed layout will appear here.</div>
            </div>
        </section>

    </main>

    <script src="/static/js/reconstruct.js?v=1"></script>
</body>
</html>
