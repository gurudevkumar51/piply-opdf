<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piply OPDF - Knowledge Base</title>
    <script src="/static/js/tailwind.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold text-blue-900 tracking-tight flex items-center">
            Piply OPDF
        </h1>
        <div class="flex space-x-3 items-center">
            <div class="flex space-x-4 border-r border-gray-300 pr-4 mr-2">
                <a href="/" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">Dashboard</a>
                <a href="/manage" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">Manage</a>
                <a href="/review" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">OCR Review</a>
                <a href="/reconstruct" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">Reconstruct</a>
                <a href="/knowledge" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">Knowledge Base</a>
            </div>
        </div>
    </header>

    <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div class="bg-white shadow rounded-lg overflow-hidden border border-gray-200">
            <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <h2 class="text-lg font-semibold text-gray-800">Learned Data</h2>
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full" id="kb-count">0 records</span>
                </div>
                <div class="flex items-center space-x-4">
                    <input type="text" id="search-knowledge" placeholder="Search knowledge..." class="border border-gray-300 rounded px-3 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 w-64" oninput="triggerSearch()">
                    <label class="text-sm font-medium text-gray-700 flex items-center space-x-2">
                        <span>Sort:</span>
                        <select id="sort-knowledge" class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none" onchange="triggerSearch()">
                            <option value="id">ID (Default)</option>
                            <option value="value_asc">Value (A-Z)</option>
                            <option value="value_desc">Value (Z-A)</option>
                        </select>
                    </label>
                    <button onclick="loadKnowledgeBase()" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1 rounded transition">Refresh</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left font-semibold text-gray-500 uppercase tracking-wider w-16">ID</th>
                            <th scope="col" class="px-6 py-3 text-left font-semibold text-gray-500 uppercase tracking-wider w-1/4">Visual Preview</th>
                            <th scope="col" class="px-6 py-3 text-left font-semibold text-gray-500 uppercase tracking-wider w-1/4">Image Hash (pHash)</th>
                            <th scope="col" class="px-6 py-3 text-left font-semibold text-gray-500 uppercase tracking-wider w-1/3">Validated Text</th>
                            <th scope="col" class="px-6 py-3 text-left font-semibold text-gray-500 uppercase tracking-wider">Source</th>
                            <th scope="col" class="px-6 py-3 text-right font-semibold text-gray-500 uppercase tracking-wider w-32">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="kb-tbody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="6" class="px-6 py-10 text-center text-gray-500">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div id="pagination-controls" class="hidden px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-between items-center">
                <span id="page-indicator" class="text-sm font-medium text-gray-700"></span>
                <div class="space-x-2">
                    <button id="btn-prev-page" class="px-3 py-1 bg-white border border-gray-300 rounded text-sm hover:bg-gray-50 disabled:opacity-50" onclick="changePage(-1)">Previous</button>
                    <button id="btn-next-page" class="px-3 py-1 bg-white border border-gray-300 rounded text-sm hover:bg-gray-50 disabled:opacity-50" onclick="changePage(1)">Next</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let kbData = [];
        let currentPage = 1;
        const itemsPerPage = 50;
        let totalItems = 0;

        function changePage(delta) {
            currentPage += delta;
            loadKnowledgeBase();
        }

        async function loadKnowledgeBase() {
            const tbody = document.getElementById('kb-tbody');
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">Loading...</td></tr>';
            
            const searchInput = document.getElementById('search-knowledge');
            const searchVal = searchInput ? searchInput.value : '';
            const sortSelect = document.getElementById('sort-knowledge');
            const sortVal = sortSelect ? sortSelect.value : '';
            
            const skip = (currentPage - 1) * itemsPerPage;
            
            try {
                const params = new URLSearchParams({
                    skip: skip,
                    limit: itemsPerPage,
                    search: searchVal,
                    sort: sortVal
                });
                const res = await fetch(`/api/knowledge?${params.toString()}`);
                const data = await res.json();
                kbData = data.items || [];
                totalItems = data.total || 0;
                renderTable();
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-red-500">Failed to load data</td></tr>`;
                console.error(e);
            }
        }

        let searchTimeout = null;
        function triggerSearch() {
            if (searchTimeout) clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentPage = 1;
                loadKnowledgeBase();
            }, 300);
        }

        function renderTable() {
            const tbody = document.getElementById('kb-tbody');
            if (kbData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500 italic">No records found.</td></tr>';
                const countEl = document.getElementById('kb-count');
                if (countEl) countEl.textContent = `0 records`;
                document.getElementById('pagination-controls').classList.add('hidden');
                document.getElementById('pagination-controls').classList.remove('flex');
                return;
            }

            tbody.innerHTML = '';
            
            const countEl = document.getElementById('kb-count');
            if (countEl) countEl.textContent = `${totalItems} records`;

            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const fragment = document.createDocumentFragment();

            kbData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition';
                
                const sourceBadge = item.source === 'human' 
                    ? '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800 uppercase">Human</span>'
                    : `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800 uppercase">${item.source}</span>`;

                const imgHtml = `<img src="/api/knowledge/image/${item.phash}" loading="lazy" onerror="this.outerHTML='<span class=\\'text-xs text-gray-400 italic\\'>No Image</span>'" class="h-10 object-contain rounded border border-gray-200" title="Hash: ${item.phash}">`;

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-gray-500 font-mono">${item.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap bg-gray-50 flex items-center justify-center">${imgHtml}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-900 font-mono text-xs truncate max-w-xs" title="${item.phash}">${item.phash}</td>
                    <td class="px-6 py-4 text-gray-900">
                        <div id="text-display-${item.id}" class="font-medium">${item.text_value}</div>
                        <input type="text" id="text-edit-${item.id}" value="${item.text_value}" class="hidden w-full border border-gray-300 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${sourceBadge}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <div id="actions-display-${item.id}">
                            <button onclick="startEdit(${item.id})" class="text-indigo-600 hover:text-indigo-900 mr-3 focus:outline-none">Edit</button>
                            <button onclick="deleteEntry(${item.id})" class="text-red-600 hover:text-red-900 focus:outline-none">Delete</button>
                        </div>
                        <div id="actions-edit-${item.id}" class="hidden">
                            <button onclick="saveEdit(${item.id})" class="text-green-600 hover:text-green-900 mr-3 font-bold focus:outline-none">Save</button>
                            <button onclick="cancelEdit(${item.id})" class="text-gray-500 hover:text-gray-900 focus:outline-none">Cancel</button>
                        </div>
                    </td>
                `;
                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);

            const pagControls = document.getElementById('pagination-controls');
            if (pagControls) {
                if (totalPages > 1) {
                    pagControls.classList.remove('hidden');
                    pagControls.classList.add('flex');
                    document.getElementById('page-indicator').textContent = `Page ${currentPage} of ${totalPages}`;
                    document.getElementById('btn-prev-page').disabled = currentPage === 1;
                    document.getElementById('btn-next-page').disabled = currentPage === totalPages;
                } else {
                    pagControls.classList.add('hidden');
                    pagControls.classList.remove('flex');
                }
            }
        }

        function startEdit(id) {
            document.getElementById(`text-display-${id}`).classList.add('hidden');
            document.getElementById(`actions-display-${id}`).classList.add('hidden');
            document.getElementById(`text-edit-${id}`).classList.remove('hidden');
            document.getElementById(`actions-edit-${id}`).classList.remove('hidden');
        }

        function cancelEdit(id) {
            document.getElementById(`text-display-${id}`).classList.remove('hidden');
            document.getElementById(`actions-display-${id}`).classList.remove('hidden');
            document.getElementById(`text-edit-${id}`).classList.add('hidden');
            document.getElementById(`actions-edit-${id}`).classList.add('hidden');
            
            // Restore original value
            const originalItem = kbData.find(k => k.id === id);
            if (originalItem) {
                document.getElementById(`text-edit-${id}`).value = originalItem.text_value;
            }
        }

        async function saveEdit(id) {
            const input = document.getElementById(`text-edit-${id}`);
            const newValue = input.value;
            
            try {
                const res = await fetch(`/api/knowledge/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text_value: newValue })
                });
                
                if (res.ok) {
                    // Update locally
                    const item = kbData.find(k => k.id === id);
                    if (item) {
                        if (item.text_value !== newValue) {
                            item.text_value = newValue;
                            item.source = 'human_update';
                            
                            // Update badge to Human
                            const badgeContainer = document.getElementById(`text-display-${id}`).closest('tr').querySelector('td:nth-child(5)');
                            if (badgeContainer) {
                                badgeContainer.innerHTML = '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800 uppercase">Human</span>';
                            }
                        }
                        // Always update text display (in case of weird formatting changes)
                        document.getElementById(`text-display-${id}`).textContent = newValue;
                    }
                    cancelEdit(id);
                } else {
                    alert('Failed to update entry');
                }
            } catch (e) {
                alert('Error connecting to server');
                console.error(e);
            }
        }

        async function deleteEntry(id) {
            if (!confirm('Are you sure you want to delete this knowledge base entry?')) return;
            
            try {
                const res = await fetch(`/api/knowledge/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadKnowledgeBase();
                } else {
                    alert('Failed to delete entry');
                }
            } catch (e) {
                alert('Error connecting to server');
                console.error(e);
            }
        }

        // Initialize
        loadKnowledgeBase();
    </script>
</body>
</html>
