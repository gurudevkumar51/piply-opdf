<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piply OPDF - Manage Storage</title>
    <script src="/static/js/tailwind.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center z-10 shadow-sm">
        <h1 class="text-xl font-bold text-blue-900 tracking-tight">Piply OPDF <span class="text-gray-400 font-medium ml-2">| Manage</span></h1>
        <div class="flex space-x-3 items-center">
            <div class="flex space-x-4 border-r border-gray-300 pr-4 mr-2">
                <a href="/" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">Dashboard</a>
                <a href="/manage" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">Manage</a>
                <a href="/review" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">OCR Review</a>
                <a href="/reconstruct" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">Reconstruct</a>
                <a href="/knowledge" class="text-sm font-bold text-gray-600 hover:text-blue-600 transition">Knowledge Base</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-8">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Uploaded Documents</h2>
            
            <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Filename</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Uploaded At</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pages</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="docs-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
                <div id="loading" class="p-8 text-center text-gray-500">
                    Loading documents...
                </div>
            </div>
        </div>
    </main>

    <script>
        async function loadDocuments() {
            const tbody = document.getElementById('docs-table-body');
            const loading = document.getElementById('loading');
            
            try {
                const res = await fetch('/documents');
                const docs = await res.json();
                
                loading.style.display = 'none';
                tbody.innerHTML = '';
                
                if (docs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-sm text-gray-500">No documents found.</td></tr>';
                    return;
                }
                
                docs.forEach(doc => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition';
                    
                    let statusColor = 'bg-gray-100 text-gray-800';
                    if (doc.status === 'completed') statusColor = 'bg-green-100 text-green-800';
                    if (doc.status === 'processing') statusColor = 'bg-yellow-100 text-yellow-800';
                    if (doc.status === 'error') statusColor = 'bg-red-100 text-red-800';
                    
                    const dateStr = new Date(doc.uploaded_at).toLocaleString();
                    
                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${doc.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${doc.filename}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${dateStr}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${doc.page_count}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">
                                ${doc.status}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="processDoc(${doc.id})" class="text-blue-600 hover:text-blue-900 mr-3" ${doc.status === 'processing' ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}>Process</button>
                            <button onclick="deleteDoc(${doc.id})" class="text-red-600 hover:text-red-900">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("Failed to load documents", e);
                loading.textContent = "Failed to load documents.";
            }
        }
        
        async function deleteDoc(id) {
            if (!confirm("Are you sure you want to delete this document?")) return;
            
            try {
                const res = await fetch(`/documents/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadDocuments();
                } else {
                    alert("Failed to delete document.");
                }
            } catch (e) {
                console.error("Delete failed", e);
            }
        }
        
        async function processDoc(id) {
            try {
                const res = await fetch(`/process/${id}`, { method: 'POST' });
                if (res.ok) {
                    loadDocuments();
                } else {
                    const data = await res.json();
                    alert("Process failed: " + data.detail);
                }
            } catch (e) {
                console.error("Process failed", e);
            }
        }
        
        // Initial load
        loadDocuments();
        
        // Polling if any docs are processing
        setInterval(() => {
            const processingExists = document.querySelector('.bg-yellow-100');
            if (processingExists) {
                loadDocuments();
            }
        }, 3000);
    </script>
</body>
</html>
