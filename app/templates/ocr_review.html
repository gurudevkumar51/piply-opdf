<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piply OPDF - OCR Bulk Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center z-10 sticky top-0 shadow-sm">
        <h1 class="text-xl font-bold text-blue-900 tracking-tight flex items-center">
            <svg class="w-6 h-6 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            Bulk OCR Review
        </h1>
        <div class="flex space-x-4 items-center">
            <!-- Search Bar -->
            <div class="relative">
                <input type="text" id="search-input" placeholder="Search cell ID, name, or text..." 
                       class="pl-10 pr-4 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-blue-500 focus:border-blue-500 w-64" oninput="window.renderReviewList()">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            
            <a href="/" class="text-sm font-medium text-blue-600 hover:text-blue-800 transition">Dashboard</a>
            <a href="/knowledge" class="text-sm font-medium text-blue-600 hover:text-blue-800 transition">Knowledge Base</a>
            
            <select id="doc-selector" class="border border-gray-300 rounded px-3 py-1.5 text-sm min-w-[200px] focus:outline-none shadow-sm cursor-pointer hover:bg-gray-50" onchange="window.selectDocument(this.value)">
                <option value="">-- Select Document --</option>
            </select>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="bg-gray-50 border-b border-gray-200 px-6 py-2 flex justify-between items-center text-sm shadow-sm">
        <div class="flex space-x-4 items-center">
            <div class="font-semibold text-gray-700">Filter by Confidence:</div>
            <select id="filter-confidence" class="border rounded px-2 py-1" onchange="window.renderReviewList()">
                <option value="all">Show All</option>
                <option value="90">Below 90%</option>
                <option value="80">Below 80%</option>
                <option value="50">Below 50%</option>
            </select>
            
            <div class="font-semibold text-gray-700 ml-4">Sort:</div>
            <select id="sort-confidence" class="border rounded px-2 py-1" onchange="window.renderReviewList()">
                <option value="default">Default (ID)</option>
                <option value="asc">Confidence (Low to High)</option>
                <option value="desc">Confidence (High to Low)</option>
            </select>

            <label class="ml-6 flex items-center space-x-2 text-sm font-medium text-gray-700 cursor-pointer">
                <input type="checkbox" id="filter-unreviewed" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500" onchange="window.renderReviewList()">
                <span>Show Only Unreviewed</span>
            </label>
            
            <div class="ml-6 text-sm font-bold text-gray-600">
                Cards: <span id="card-count">0</span>
            </div>
        </div>
        <div>
            <button class="bg-green-600 hover:bg-green-700 text-white px-4 py-1 rounded shadow text-sm font-bold transition" onclick="window.acceptAllFiltered()">
                Accept All Filtered
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6 relative">
        <div id="loading" class="hidden absolute inset-0 bg-white bg-opacity-75 flex justify-center items-center z-10">
            <div class="text-lg font-bold text-gray-500 animate-pulse">Loading cells...</div>
        </div>
        
        <div id="review-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full text-center text-gray-500 mt-10">Select a document to begin review.</div>
        </div>
    </main>

    <script src="/static/js/review.js?v=2"></script>
</body>
</html>
